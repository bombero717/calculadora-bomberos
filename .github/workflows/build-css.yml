name: Compilar CSS y actualizar caché de assets estáticos

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'style.css'

jobs:
  build-css:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar CSS con Tailwind
        run: npm run build

      - name: Actualizar el hash de caché (?v=) de style.css si cambió
        run: |
          if ! git diff --quiet -- style.css; then
            HASH=$(sha256sum style.css | cut -c1-8)
            echo "style.css cambió, nuevo hash: $HASH"
            grep -rlE 'href="/style\.css(\?v=[a-f0-9]+)?"' --include="*.html" . \
              | xargs sed -i -E "s#href=\"/style\.css(\?v=[a-f0-9]+)?\"#href=\"/style.css?v=${HASH}\"#"
          else
            echo "style.css sin cambios."
          fi

      - name: Actualizar el hash de caché (?v=) de hub-profesiones.js si cambió
        run: |
          if ! git diff --quiet -- hub-profesiones.js; then
            HASH=$(sha256sum hub-profesiones.js | cut -c1-8)
            echo "hub-profesiones.js cambió, nuevo hash: $HASH"
            grep -rlE 'src="/hub-profesiones\.js(\?v=[a-f0-9]+)?"' --include="*.html" . \
              | xargs sed -i -E "s#src=\"/hub-profesiones\.js(\?v=[a-f0-9]+)?\"#src=\"/hub-profesiones.js?v=${HASH}\"#"
          else
            echo "hub-profesiones.js sin cambios."
          fi

      - name: Actualizar el hash de caché (?v=) de asistente-ia.js si cambió
        run: |
          if ! git diff --quiet -- asistente-ia.js; then
            HASH=$(sha256sum asistente-ia.js | cut -c1-8)
            echo "asistente-ia.js cambió, nuevo hash: $HASH"
            grep -rlE 'src="/asistente-ia\.js(\?v=[a-f0-9]+)?"' --include="*.html" . \
              | xargs sed -i -E "s#src=\"/asistente-ia\.js(\?v=[a-f0-9]+)?\"#src=\"/asistente-ia.js?v=${HASH}\"#"
          else
            echo "asistente-ia.js sin cambios."
          fi

      - name: Commitear cambios si los hay
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore: actualizar hash de caché de assets estáticos [skip ci]"
            git push
          else
            echo "Sin cambios, nada que commitear."
          fi
